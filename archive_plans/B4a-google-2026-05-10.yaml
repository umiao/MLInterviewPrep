promotion_candidates:
- id: meta-prep/famous-papers
  kind: cluster
  cross_refs:
  - google
  - doordash
  - uber
  - pinterest
  rationale: '4-section gist (What / Why-mattered / Architecture / Gotcha) for each of: YouTube DNN, Two-Tower, Wide&Deep, DCN/DCN-V2, DLRM, MMoE, PLE, BERT4Rec, SASRec, SimCLR/BYOL. | meta-prep/famous-papers/{youtube-dnn, two-tower-paper, wide-and-deep, dcn-v1-v2, dlrm, mmoe, ple, bert4rec, sasrec, simclr-byol-contrastive} (10 children under a new sibling of meta-prep/system-design-must-knows).'
  diff_preview: 'DLRM (Naumov 2019) -- Facebook''s reference deep recsys: dense-feature MLP + sparse-embedding interactions + top MLP. Why mattered: open-sourced reference for DLRM throughput benchmarking. Gotcha: embedding tables dominate memory; sharding strategy != model parallelism.'
  target_path: meta-prep/famous-papers
- id: meta-prep/system-design-must-knows/feature-drift-detection
  kind: new_node
  cross_refs:
  - google
  - pinterest
  - uber
  - doordash
  rationale: PSI / KL / JS / KS distance metrics + concept vs covariate shift framing + alert thresholds.
  diff_preview: PSI (Population Stability Index) = sum_i (p_i - q_i) * ln(p_i / q_i) over discretized bins; PSI < 0.1 stable, 0.1-0.25 moderate, > 0.25 alert. KL/JS for continuous; KS for full distribution shape.
  target_path: meta-prep/system-design-must-knows/feature-drift-detection
- id: meta-prep/system-design-must-knows/train-serve-skew-leakage
  kind: new_node
  cross_refs:
  - google
  - linkedin
  - doordash
  - uber
  rationale: target encoding leakage + OOF + as-of-time joins + temporal split (rolling-origin CV) + future-only aggregates + feature store online/offline parity.
  diff_preview: 'Target encoding leakage: encoding a category by mean-target on the full training set leaks the holdout. Fix = OOF: encode fold k using only folds != k. Same trap on as-of-time joins -- always use the feature value visible at the prediction timestamp.'
  target_path: meta-prep/system-design-must-knows/train-serve-skew-leakage
- id: meta-prep/system-design-must-knows/bidding-calibration-coupling
  kind: new_node
  cross_refs:
  - google
  - etsy
  rationale: in二价拍卖 / sponsored search, calibration error multiplies expected bid error (E[bid] = value * P(click) * margin -- non-linearity in P amplifies miscalibration).
  diff_preview: 'Calibration matters more in bidding than in classification: a 10% Platt overestimate doubles the second-price expected GMB shortfall when bids cluster near reserve.'
  target_path: meta-prep/system-design-must-knows/bidding-calibration-coupling
- id: meta-prep/code-pad-best-practices/oral-flashcard-2min-pacing
  kind: new_node
  cross_refs:
  - google
  - linkedin
  - doordash
  rationale: per-topic 2-min oral answer pacing -- 1 anchor formula + 1 numeric example + 1 gotcha; per card, no narration drift.
  diff_preview: '2-min oral answer card structure: (1) one core formula or 1 numeric anchor; (2) one example showing the formula in motion; (3) one gotcha or anti-pattern. Do NOT recite from memory; reconstruct the formula on the spot.'
  target_path: meta-prep/code-pad-best-practices/oral-flashcard-2min-pacing
- id: meta-prep/onsite-loop-templates/round-of-day-mindset
  kind: new_node
  cross_refs:
  - google
  rationale: last-minute mindset bullets -- "don't recite formulas, tell real stories", "when challenged, clarify assumption first, then adjust", "on details, admit uncertainty + give range + reasoning".
  diff_preview: 'Round-of-day mindset: when challenged, do not flip your answer immediately. Clarify the assumption being challenged, then adjust. On numeric details you can''t recall, give a range + the reasoning that bounds it.'
  target_path: meta-prep/onsite-loop-templates/round-of-day-mindset
- id: meta-prep/system-design-must-knows
  kind: drill_depth_merge
  cross_refs: []
  rationale: the existing meta-prep/system-design-must-knows/* nodes (calibration, ndcg, two-tower, ltr, ab-testing, mmoe, diversity, feature-store, popularity-bias, infonce) have descriptions that summarize the topic but do not include the derivation depth present in the Google drill docs (id=55, 56, 60-69, 72). | T-P1-821 reads each drill, extracts the de-companied derivation + formula + gotcha, and appends to the corresponding meta-prep node's description (or a description_drill field if it exists).
  diff_preview: the existing meta-prep/system-design-must-knows/* nodes (calibration, ndcg, two-tower, ltr, ab-testing, mmoe, diversity, feature-store, popularity-bias, infonce) have descriptions that summarize the topic but do not include the derivation depth present in the Google drill docs (id=55, 56, 60-69, 72).
  target_path: meta-prep/system-design-must-knows
