name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-scraper.txt
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-scraper.txt
      - run: python -m pytest tests/ -v --tb=short

  migration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-scraper.txt
      - run: python -m pytest tests/test_migrations.py tests/test_schema_audit.py -v --tb=short

  emoji-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_emoji.py

  uri-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: db_present
        shell: bash
        run: |
          if [ -f data/mle_prep.db ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.db_present.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: steps.db_present.outputs.found == 'true'
        run: python scripts/audit_uri_consistency.py
