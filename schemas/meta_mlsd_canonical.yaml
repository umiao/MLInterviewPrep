# Meta-MLSD Canonical Schema
# ----------------------------------------------------------------------------
# Source of truth for the Meta-MLSD content overhaul (T-P0-865 .. T-P0-872).
# Consumed by:
#   - T-P0-866 (cd96 surgery)
#   - T-P0-867 (sd41 prune)
#   - T-P0-868 (sd42 reseed)
#   - T-P0-869 (meta-weapon-ads-golden)
#   - T-P0-870 (meta-friend-rec-golden)
#   - T-P0-871 (cd96 link-in)
#   - T-P0-872 (scripts/audit_meta_mlsd_3rule.py validator)
#
# Design rationale:
#   5 fresh-context parallel agents will drift on prose "tighten" unless they
#   share a machine-checkable contract. The 3-rule is encoded at SECTION
#   granularity (not per-bullet) because mechanism bullets like
#   "HNSW M=32 p99 8ms" do not need a twist-callback suffix; the twist-callback
#   is a section-level rhythm property, not a per-line decoration.
# ----------------------------------------------------------------------------

schema_version: 1
generated_at: "2026-05-13"
generated_by_task: T-P0-865

