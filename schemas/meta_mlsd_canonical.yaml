# ============================================================================
# DOC-TYPE: cd96-playbook
# ============================================================================
# Single Markdown blob in company_documents.content. The "homepage" of the
# Meta MLSD hub: methodology + 4 Strong Moments + ML-native vocab + meta-rules.
# Per-twist worked examples live in sd-golden rows (linked via sd:// in drawer).
# ----------------------------------------------------------------------------
cd96_playbook:
  description: |
    Methodology homepage. Owns: timing rhythm, Strong Moments slots, vocab
    YES/NO, meta-rules. Does NOT own: per-twist worked walkthroughs (those
    live in sd-golden). Sections 5-8 are intentionally kept abstract here.

  drawer_header:
    rule_id: R-DRAWER-cd96
    required: true
    # Full 13-题 family coverage in drawer (2026-05-15 widened from 4 to 13;
    # ordered by cd94 Q-number to mirror the taxonomy):
    must_link_sd_goldens:
      - meta-top3-comments-golden       # Q1, T-P0-868
      - meta-v2v-search-golden          # Q2, T-P1-886 (top-9 batch)
      - meta-friend-rec-golden          # Q3, T-P0-870
      - meta-ads-golden                 # Q4, T-P0-885 (top-9 batch)
      - meta-event-rec-golden           # Q5, T-P1-887 (top-9 batch)
      - meta-location-rec-golden        # Q6, T-P1-888 (top-9 batch)
      - meta-weapon-ads-golden          # Q7, T-P0-869
      - meta-yelp-restaurant-golden     # Q8, N1.5 anchor (top-9 batch)
      - meta-fb-newsfeed-golden         # Q9, N1 anchor (top-9 batch)
      - meta-ig-story-golden            # Q10, T-P0-883 (top-9 batch)
      - meta-spotify-music-golden       # Q11, T-P2-889 (top-9 batch)
      - meta-event-attendance-golden    # Q12, T-P0-884 (top-9 batch)
      - meta-reels-golden               # Q13, T-P0-837
    must_use_sd_protocol_link: true   # "sd://<slug>" syntax, not raw markdown URL

  sections:
    - id: "§1"
      heading_regex: '^## 1\.\s*节奏.*Timing Skeleton'
      required: true
      payload_kind: timing_skeleton_table
      row_schema:
        rule_id: R-TIMING-row-4tag
        # Each row of the 45-min timing table MUST carry these 4 tags.
        # Empty (`-`) is allowed for `twist` and `scale` when the phase is
        # transit-rhythm only, but `rhythm` and `trade` are non-empty for ALL rows.
        columns:
          - {name: time_band,    required: true,  example: "0-3 min"}
          - {name: rhythm,       required: true,  vocab: [Framing, Data, Model, Bias, Evaluation, Zoomout, Serving, QA]}
          - {name: strong_moment_slot, required: true, vocab: ["#1", "#2", "#3", "#4", "-"]}
          - {name: tag_twist,    required: true,  empty_ok: true, semantic: "which sd:// twist this rhythm row hosts, or '-'"}
          - {name: tag_scale,    required: true,  empty_ok: true, semantic: "concrete numeric anchor if applicable (latency / dim / traffic)"}
          - {name: tag_trade,    required: true,  empty_ok: false, semantic: "one-line tradeoff or rhythm-rule statement"}
      delete_subsection:
        - id: "§2.2"
          heading_regex: 'Per-twist 4\s*段推导模板'   # "Per-twist 4-段推导模板"
          rationale: "abstract template duplicates per-twist worked examples in sd-golden"
          enforced_by_task: T-P0-866

    - id: "§2"
      heading_regex: '^## 2\.\s*Twist'
      required: true
      payload_kind: prose_with_subsections
      keep_subsections: ["§2.1", "§2.3", "§2.4"]
      delete_subsections: ["§2.2"]
      apply_3rule: true

    - id: "§3"
      heading_regex: '^## 3\.\s*4 Strong Moments'
      required: true
      payload_kind: strong_moment_slots
      slot_count: 4
      slot_heading_regex: '^### Strong Moment #([1-4])'
      apply_3rule: true

    - id: "§4"
      heading_regex: '^## 4\.\s*ML-Native Vocabulary'
      required: true
      payload_kind: yes_no_table
      apply_3rule: false

    - id: "§5"
      heading_regex: '^## 5\.\s*Framing.*Body.*Strong.*Zoom'
      required: true
      payload_kind: prose_meta_structure
      apply_3rule: true

    - id: "§6"
      heading_regex: '^## 6\.\s*偏好节奏.*Meta-rules'
      required: true
      payload_kind: numbered_meta_rules
      min_bullets: 8
      max_bullets: 8
      apply_3rule: false   # meta-rules ARE the rules; no twist-callback needed
      rationale: "8 meta-rules are themselves the rhythm spec; exempt from twist-callback"

    - id: "§7"
      heading_regex: '^## 7\.\s*减少澄清'
      required: true
      payload_kind: prose
      apply_3rule: true

    - id: "§8"
      heading_regex: '^## 8\.\s*E4.*E5'
      required: true
      payload_kind: boundary_table
      apply_3rule: false

    - id: "§9"
      heading_regex: '^## 9\.\s*Drawer'   # "Drawer — 深内容入口" (T-P0-871 inserted)
      required: true
      payload_kind: drawer_link_list
      apply_3rule: false   # link list; 3-rule does not apply
      rationale: "drawer link list; rhythm rules live on §1/§2/§3/§5/§7/§10"

    - id: "§10"
      heading_regex: '^## 10\.\s*30\s*秒'   # "30 秒判题流程" (renumbered from §9 by T-P0-871)
      required: true
      payload_kind: numbered_steps
      min_bullets: 5
      max_bullets: 15
      apply_3rule: true

# ============================================================================
# DOC-TYPE: sd-golden
# ============================================================================
# system_designs row split across multiple Markdown fields. Each instance
# walks a SINGLE 45-min interview verbatim. NO drawer header table inside
# the sd-golden body (the drawer table belongs to cd96 only).
# ----------------------------------------------------------------------------
sd_golden:
  description: |
    Per-twist 45-min walkthrough. Owns: framing-language verbatim, label
    schema, architecture, dataflow rhythm, tradeoffs, Strong Moment verbatim.
    Does NOT own: meta-rules, vocab YES/NO, 8-rules-of-rhythm (those live
    in cd96). cheat_sheet + verbal_outline are OPTIONAL; if used, they must
    not duplicate cd96 §1/§5/§6.

  forbidden_top_block:
    rule_id: R-DRAWER-no-sd-drawer
    pattern_regex: '^\|.*sd://.*\|'      # no drawer table at top of sd-golden body
    rationale: "drawer table belongs to cd96; including it in sd-golden duplicates state"
    enforced_by_tasks: [T-P0-867, T-P0-868, T-P0-869, T-P0-870]

  fields:
    - id: overview
      required: true
      apply_3rule: true
      target_chars: {min: 1500, max: 4500}
      must_contain_semantic:
        - {tag: framing_anchor,  description: "what this design solves in one sentence"}
        - {tag: twist_list,      description: "the 2-4 unique twists this golden showcases"}
      forbidden_subsection_regex:
        - {id: R-FORBID-rhythm-philosophy, pattern: '^##\s*整体节奏哲学', rationale: "duplicates cd96 §6"}
      cross_page_check:
        rule_id: R-XPAGE-twist-list-matches-cd96-drawer
        description: "twist_list in overview must match the twists declared in cd96 drawer for this sd:// slug"

    - id: architecture
      required: true
      apply_3rule: true
      target_chars: {min: 2000, max: 6000}
      must_contain_semantic:
        - {tag: stage_funnel,  description: "explicit stage funnel (retrieval / ranking / rerank / serving) OR equivalent decomposition"}

    - id: dataflow
      required: true
      apply_3rule: true
      target_chars: {min: 2500, max: 9000}
      must_contain_semantic:
        - {tag: time_anchored_walkthrough, description: "minute-by-minute or section-by-section verbatim walk"}

    - id: formulas
      required: false                    # sd41 may skip; sd42 must include label schema
      apply_3rule: false
      rationale: "formulas are anchors, not narrative; 3-rule does not apply"

    - id: production_constraints
      required: false
      apply_3rule: true

    - id: tradeoffs
      required: true
      apply_3rule: true                  # this is the highest-density 3-rule section
      min_bullets: 6
      max_bullets: 10
      bullet_pattern_regex: '^[0-9]+\.\s.+\bvs\b.+'
      bullet_semantic_template: '"I pick A because X, costs Y, switches to B if Z"'

    - id: defense
      required: true
      apply_3rule: true
      target_chars: {min: 2500, max: 8500}
      must_contain_semantic:
        - {tag: strong_moment_verbatim, description: "the 4 Strong Moment lines in interview-ready English"}
      forbidden_subsection_regex:
        - {id: R-FORBID-why-this-is-strong, pattern: '(?i)why this is strong', rationale: "meta-commentary about the Strong Moment is methodology, lives in cd96"}

    - id: cheat_sheet
      required: false
      apply_3rule: false
      rationale: "30-sec flash card; intentionally telegraphic, exempt from 3-rule"
      duplication_guard:
        rule_id: R-XPAGE-cheatsheet-no-cd96-dup
        description: "if present, must NOT verbatim duplicate cd96 §1 / §5 / §6"

    - id: verbal_outline
      required: false
      apply_3rule: false
      duplication_guard:
        rule_id: R-XPAGE-verbal-no-cd96-dup
        description: "if present, must NOT verbatim duplicate cd96 §5 meta-structure prose"

# ============================================================================
# DOCUMENT ARCHETYPES (T-P1-875)
# ============================================================================
# sd-golden content can adopt one of two archetypes. Default is
# structured_reference (the original 10-field shape -- sd_golden.fields above
# is its contract). oral_narrative is a relaxed contract where the full
# 45-min talk lives in a single continuous dataflow column, with立场s and
# trade-offs inlined rather than extracted into separate tradeoffs/defense
# fields.
#
# Decision rationale: review (Discord msg 1504368694875394158 / PROGRESS
# 2026-05-13 22:55) noted the original schema conflates "presentation shape"
# (10 fields, bold density, char ranges) with "semantic quality" (causal
# chain, explicit立场+trade-off, twist callback). The 4 criteria can be
# satisfied by either archetype; archetype choice is the author's style call,
# not a quality gate. Author verifies the 4 criteria via mechanical audit
# before migration; this YAML records the resulting archetype declaration.
#
# Scope:
#   - oral_narrative ships ONLY on sd41 (Reels) as the validation case.
#     3 sister sd-goldens (sd42 top3 / sd-weapon / sd-friend) stay
#     structured_reference. Per review, do not retrofit all 4 in one pass.
#
# Deferred (NOT in this archetype, will design separately if needed):
#   - semantic_detector (NLP-grade tradeoff/failure-mode auto-detection)
#   - tight max_chars (n=1 instance, not enough data to fit)
#   - explicit_tradeoff_line_count_min (review:"first see if defaults bite")
# ----------------------------------------------------------------------------
document_archetypes:
  added_at: "2026-05-13"
  added_by_task: T-P1-875
  applies_to: sd_golden
  default_archetype: structured_reference

  values:
    structured_reference:
      description: |
        Original 10-field shape. All required fields in `sd_golden.fields`
        must be populated; R-NARRATIVE-prose-form applies; R-DIFFDELTA-70pct
        applies against BASELINE_CHARS.
      contract_ref: sd_golden       # the sd_golden block above is the contract

    oral_narrative:
      description: |
        Single continuous 第一人称 口播稿 in `dataflow`. tradeoffs / Strong
        Moments / verbatim quotes are inlined in the narrative, not extracted
        to separate fields. NULL is legal on architecture / production_constraints /
        tradeoffs / defense / verbal_outline.
      contract:
        required_fields:
          - id: dataflow
            min_chars: 4000            # n=1 floor; max intentionally not fitted
            apply_3rule: true          # causal / tradeoff / scale / twist still required at section level
            apply_narrative_prose_form: false
            rationale_no_narrative_prose_form: |
              R-NARRATIVE bold_density >= 3 is a Markdown-form proxy; Chinese
              口播稿 doesn't decorate every paragraph with **bold**.
              R-3RULE-* on this section already enforces the substantive
              tradeoff / decision / scale / twist properties.
          - id: overview
            min_chars: 200
            apply_3rule: false         # short framing anchor, not a fully-loaded narrative section
            apply_narrative_prose_form: false
        optional_fields:
          - {id: formulas, apply_3rule: false, apply_narrative_prose_form: false}
          - {id: cheat_sheet, apply_3rule: false, apply_narrative_prose_form: false}
        nullable_fields:
          # These are required:true in sd_golden.fields but NULL is legal for
          # oral_narrative because their content lives inline in dataflow.
          - architecture
          - production_constraints
          - tradeoffs
          - defense
          - verbal_outline
        cross_page_overrides:
          R-XPAGE-section-naming:
            action: skip
            rationale: "oral_narrative has no `defense` field, so the Strong-Moments header check doesn't apply."
        diff_delta:
          baseline_source: instance.baseline_chars_post_migration
          rationale: |
            Archetype migration is by design a substantive change. BASELINE_CHARS
            (45274 for sd41) was the structured_reference size; for ongoing diff-delta
            gating, the post-migration size (recorded on the instance) becomes the
            new baseline. Future deletions are still gated against this baseline.

# ============================================================================
# 3-RULE (SECTION-LEVEL)
# ============================================================================
# A section "passes" rule R-3RULE-X if AT LEAST ONE bullet/line in the section
# satisfies the rule's regex/semantic. Per-bullet enforcement would force
# cargo-cult suffixes onto mechanism bullets (e.g. "HNSW M=32 p99 8ms") that
# do not need a twist callback. The twist callback is a section-level rhythm
# property -- it must appear somewhere, but not on every line.
# ----------------------------------------------------------------------------
three_rule:
  applies_at: section
  pass_threshold: at_least_one_bullet
  rules:
    R-3RULE-decision:
      label: decision_present
      description: |
        section contains an explicit ranked decision -- English: 'I pick X',
        'choose A over B', 'default to Y'; Chinese: '我选/我会/我推荐/我打算/
        我特意/首选/默认走/我用'.
      detect_regex:
        - '\b(I pick|we pick|I choose|we choose|default to|pick A)\b'
        - '(?i)\bdecision\b.*\bover\b'
        # Chinese alternates (T-P1-875): oral_narrative archetype in 中文 口播稿
        # expresses the same立场 pattern with these particles.
        - '我(选|会推荐|推荐|打算|特意|默认|定位|首选|的处理是|挑|用一个)'
        - '首选|主线|主力|默认走'

    R-3RULE-tradeoff:
      label: tradeoff_present
      description: |
        section contains explicit costs/switches -- English: 'costs Y',
        'switches to B if Z', '... at the cost of ...'; Chinese: '代价是/
        换/不过/更稳/吃不动/不是因为...是因为'.
      detect_regex:
        - '(?i)\b(costs?|at the cost of|switches? to|in exchange for)\b'
        - '\bvs\b'
        # Chinese alternates (T-P1-875).
        - '代价(是|, |。)|代价是|换来|权衡|tradeoff|trade-off'
        - '更稳|更好 ship|吃不动|不展开|点到为止|不是.*是因为|更干净|更可 audit'

    R-3RULE-scale-sla:
      label: scale_sla_present
      description: "section anchors at least one concrete number: latency, dimension, QPS, candidate-count, dataset size."
      detect_regex:
        - '\b\d+\s*(ms|µs|us|qps|QPS|dim|k|K|M|B|fps|min|sec|s)\b'
        - '\bp(50|95|99|999)\b'
        - '\bHNSW\b|\bIVF\b'   # algorithmic anchors implying scale design

    R-3RULE-twist-callback:
      label: twist_callback_present
      description: "section names the unique twist it is hosting -- e.g. 'the bilateral matching twist', 'this is where the ambiguous-middle label pays off'"
      detect_regex:
        - '(?i)\b(twist|unique angle|the core decision here is|this is where)\b'
        - '(?i)\bcallback (to|of)\b'

# ============================================================================
# R-NARRATIVE-prose-form (T-P0-869+ retrofitted to T-P0-873 for sd41/sd42)
# ============================================================================
# sd-golden bodies are oral-recital interview narrative scripts in first-person
# English ("I pick", "I'd reframe"), NOT bullet-heavy markdown notes. Applies to
# sections marked apply_3rule:true. Measurable proxies are enforced by each
# seed script's validate() and by scripts/audit_meta_mlsd_3rule.py (T-P0-872).
# ----------------------------------------------------------------------------
narrative_prose_form:
  rule_id: R-NARRATIVE-prose-form
  applies_to: sd_golden
  applies_at: section
  applies_when: apply_3rule == true
  added_at: "2026-05-13"
  added_by_task: T-P0-869
  retrofit_tasks: [T-P0-873]   # sd41 + sd42 conversion from bullet-style
  semantic_rules:
    - Each section opens with a declarative one-sentence claim.
    - Each section runs bold-anchored substantive prose.
    - Each section closes with a trade-off / handoff sentence.
    - First-person interview voice ('I pick', 'I'd reframe', 'this is where').
    - No instructor-commentary or note-voice leftovers.
  measurable_proxy:
    bold_density_per_section_min: 3      # >=3 **bold** spans per apply_3rule section
    bullet_run_max_consecutive: 4        # >4 unbroken bullet lines = violation
    table_row_max: 3                     # markdown tables with >3 body rows = violation
  detect_regex:
    bold: '\*\*[^*\n]+\*\*'
    bullet_line: '^\s*[-*]\s+'
    table_line: '^\|'
  rationale: |
    Bullet-heavy markdown reads like lecture notes, not interview speech. The
    measurable proxies (>=3 bold / <=4 consecutive bullets / <=3-row tables)
    are coarse but cheap to enforce and correlate well with oral-recital form.

# ============================================================================
# FORBIDDEN PATTERNS (regex-level)
# ============================================================================
# These strings/phrases should not appear anywhere in cd96 or sd-golden
# bodies. They are footprints of the pre-overhaul state.
# ----------------------------------------------------------------------------
forbidden_patterns:
  - id: R-FORBID-why-this-is-strong
    pattern: '(?i)why this is strong'
    scope: [sd_golden.defense]
    rationale: "meta-commentary belongs in cd96, not sd-golden verbatim"

  - id: R-FORBID-rhythm-philosophy
    pattern: '整体节奏哲学'    # "整体节奏哲学"
    scope: [sd_golden.overview]
    rationale: "duplicates cd96 §6"

  - id: R-FORBID-drawer-header-literal
    pattern: '^\|\s*Doc\s*\|.*sd://'
    scope: [sd_golden.overview, sd_golden.architecture, sd_golden.dataflow,
            sd_golden.tradeoffs, sd_golden.defense, sd_golden.cheat_sheet,
            sd_golden.verbal_outline]
    rationale: "drawer header is a cd96-only artifact"

  - id: R-FORBID-per-twist-4-section-template
    pattern: '(?i)Per-twist 4-section template|Per-twist 4\s*段推导模板'
    scope: [cd96_playbook]
    rationale: "abstract template -> replaced by concrete sd-golden examples"

# ============================================================================
# CROSS-PAGE CONSISTENCY (T-872 part B)
# ============================================================================
cross_page_consistency:
  R-XPAGE-section-naming:
    description: "the 4 sd-golden instances must use IDENTICAL canonical naming for the Strong Moments section header"
    canonical_header_regex: '^#\s*Strong Moments|^# .*Strong Moments.*verbatim'
    must_not_mix_synonyms: ["Defense Highlights", "Key Moments", "Verbatim Lines"]

  R-XPAGE-sd-link-resolves:
    description: "every sd:// link inside cd96 must resolve to a system_designs.slug that exists"
    check: lookup_in_db
    db_table: system_designs
    db_column: slug

  R-XPAGE-twist-list-matches-cd96-drawer:
    description: "the twist_list declared in each sd-golden overview must match the twists declared for that slug in cd96 drawer header"

  R-XPAGE-cheatsheet-no-cd96-dup:
    description: "if sd-golden.cheat_sheet exists, it must not verbatim include >5 consecutive bullets from cd96 §1/§5/§6"
    max_consecutive_overlap_bullets: 5

# ============================================================================
# DIFF-DELTA HEURISTIC (T-872 part C)
# ============================================================================
diff_delta:
  R-DIFFDELTA-70pct:
    description: "if a prune task (T-867 sd41, T-868 sd42) reduces line count by >70%, halt and request human review -- likely over-deleted"
    threshold_pct: 70
    target_pct: 40
    action_on_breach: human_review_required

# ============================================================================
# 90-SECOND FORCING FUNCTION (T-870 friend rec Section 5)
# ============================================================================
ninety_second_forcing:
  R-90S-friend-rec-section5:
    description: |
      Friend Rec sd-golden Section 5 (model architecture, 15-20min slot in the
      walkthrough) must compress its tabular encyclopedia (LR/XGBoost/DNN/MMoE/
      Transformer ladder + 5 retrieval channels table + serving table) to a
      narrative rhythm. Apply the question 'if only 90 seconds, which 3
      sentences?' after rewrite -- the 3 sentences must keep MMoE multi-head
      bilateral, cluster-randomized A/B, and NRT bilateral signal.
    applies_to: {ref: sd-friend, field: dataflow_or_architecture}
    keep_anchors:
      - "MMoE multi-head bilateral"
      - "cluster-randomized A/B"
      - "NRT bilateral signal"
    compress_to_one_paragraph_each:
      - "model ladder (LR -> XGBoost -> DNN -> MMoE -> Transformer)"
