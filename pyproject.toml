[project]
name = "mle-interview-prep"
version = "0.1.0"
description = "MLE Interview Prep Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.109.0",
    "python-multipart==0.0.20",
    "uvicorn[standard]==0.41.0",
    "sqlalchemy==2.0.25",
    "anthropic==0.84.0",
    "python-dotenv==1.2.1",
    "pydantic==2.12.4",
    "pydantic-settings==2.13.1",
    "httpx==0.27.2",
    "python-docx==1.1.2",
    "edge-tts==7.2.7",
]

[project.optional-dependencies]
dev = ["pytest==7.4.4", "pytest-asyncio==0.23.3", "ruff==0.15.4", "pyyaml==6.0"]
scraper = ["playwright==1.58.0", "beautifulsoup4==4.12.2"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line length handled by line-length setting
    "B008",   # Depends() in function defaults is standard FastAPI pattern
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests requiring network access",
]
filterwarnings = [
    "ignore::PendingDeprecationWarning:starlette",
    "ignore::DeprecationWarning:httpx",
]
